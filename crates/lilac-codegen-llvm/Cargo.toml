[package]
name = "lilac-codegen-llvm"
version.workspace = true
edition.workspace = true

[dependencies]
inkwell = { version = "0.10", features = ["llvm18-1"] }
lilac-error = { path = "../lilac-error" }
lilac-ir = { path = "../lilac-ir" }
lilac-layout = { path = "../lilac-layout" }
lilac-span = { path = "../lilac-span" }
lilac-target = { path = "../lilac-target" }
lilac-codegen = { path = "../lilac-codegen" }

[lints]
workspace = true

# On macOS `build.rs` links LLVM, so the compiler needs nothing outside
# macOS (see the script).
[target.'cfg(target_os = "macos")'.dependencies]
llvm-sys = { version = "181", features = ["no-llvm-linking"] }
